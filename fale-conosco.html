<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contato.css">
</head>
<body class="pagina-contato">
    <header class="cabecalho">
        <div class="logo">
            <h1>PORTAL DO TÉCNICO EM INFORMÁTICA</h1>
            <p>Escola Estadual Maria Barbosa Leite</p>
        </div>
    </header>

    <main class="contato-container">
        <section class="contato-card">
            <a href="index.html" class="contato-voltar">← Voltar ao início</a>
            <h1>Fale Conosco</h1>
            <p>Envie sua dúvida, sugestão ou reclamação.</p>

            <form id="contato-form" class="contato-form">
                <div class="campo-contato">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" maxlength="100" required>
                </div>

                <div class="campo-contato">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" maxlength="150" required>
                </div>

                <div class="campo-contato">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" maxlength="20" placeholder="(DDD) 00000-0000" required>
                </div>

                <div class="campo-contato">
                    <label for="mensagem">Dúvida ou reclamação</label>
                    <textarea id="mensagem" name="mensagem" maxlength="1000" required></textarea>
                </div>

                <button type="submit" class="contato-botao">Enviar mensagem</button>
            </form>
        </section>
    </main>

    <footer class="rodape">
        <div class="rodape-final">
            <p>© 2026 Escola Estadual Maria Barbosa Leite - Técnico em Informática</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-contato.js"></script>
</body>
</html>
