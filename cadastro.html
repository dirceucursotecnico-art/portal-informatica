<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-cadastro">

    <div class="cadastro">
        <h1>Cadastro</h1>

        <form onsubmit="cadastrar(event)">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" placeholder="Digite sua idade" min="1" max="120" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>

            <button type="submit" class="btn-entrar">Cadastrar</button>

            <a href="index.html" class="btn-cadastro">← Voltar para o início</a>
        </form>
    </div>
    <script src="script.js"></script>
    <script src="integracao.js"></script>
</body>
</html>
